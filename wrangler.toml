# Cloudflare Workers 설정 파일

# 호환성 날짜 (Workers 런타임 버전)
compatibility_date = "2025-07-26"

# 메인 진입점 파일
main = "src/index.ts"

# Worker 이름
name = "destinyworker"

# 소스맵 업로드 활성화
upload_source_maps = true

# 리소스 제한 설정
[limits]
cpu_ms = 30000      # CPU 사용 시간 제한 (30초)
memory_mb = 128     # 메모리 사용량 제한 (128MB)

# D1 데이터베이스 설정
[[d1_databases]]
database_name = "destiny"    # 프로덕션 데이터베이스
binding = "DB"
database_id = "f9ef2666-6d2f-419e-b54e-7d7f6951f036"
experimental_remote = true

[[d1_databases]]
database_name = "destiny-local"
binding = "DB_LOCAL"
database_id = "b9c839c9-2356-4bb9-ab20-46e32a85aa2b"
experimental_remote = true

# KV 네임스페이스 설정 (캐시 저장소)
[[kv_namespaces]]
binding = "VIEW_CACHE_KV"        # 뷰 캐시용 KV
id = "f76d441ea2524c58a72e355fb4df71b2"
preview_id = "68d8ef3bc1644f2f81cca8b57f842267"
experimental_remote = true

# 인증 코드용 KV 네임스페이스
[[kv_namespaces]]
binding = "AUTH_CODE_KV"         # 인증 코드용 KV
id = "305beea2b37c45ef9cfb10f957c6c1a1"
preview_id = "305beea2b37c45ef9cfb10f957c6c1a1"
experimental_remote = true

# AI 서비스 설정
[ai]
binding = "AI"                   # AI 모델 바인딩
experimental_remote = true

# Vectorize 인덱스 설정 (벡터 검색용)
[[vectorize]]
binding = "VECTORIZE_INDEX"      # 사주 지식 검색용 벡터 인덱스
index_name = "saju-index"
experimental_remote = true

# R2 스토리지 설정
[[r2_buckets]]
binding = "DESTINY_R2"           # 파일 저장용 R2 버킷
bucket_name = "destiny"
preview_bucket_name = "destiny-dev"
experimental_remote = true

[durable_objects] # Durable Objects 설정 (상태 유지 객체)
[[durable_objects.bindings]] # 바인딩 설정
name = "SAJU_ANALYSIS_WORKER"   # 사주 분석 워커 객체
class_name = "SajuAnalysisWorker"

[[durable_objects.bindings]]
name = "COLUMN_WORKER"           # 칼럼 생성 워커 객체
class_name = "ColumnWorker"

[[durable_objects.classes]] # 클래스 정의
name = "SajuAnalysisWorker"      # 사주 분석 워커 클래스
script_name = "destinyworker"
experimental_remote = true

[[durable_objects.classes]]
name = "ColumnWorker"            # 칼럼 생성 워커 클래스
script_name = "destinyworker"
experimental_remote = true

[[migrations]] # 마이그레이션 설정
tag = "v1"
new_classes = ["SajuAnalysisWorker"]  # 새로운 Durable Object 클래스

[[migrations]]
tag = "v2"
new_classes = ["ColumnWorker"]

[vars] # 환경 변수
ENVIRONMENT = "production"       # 환경 설정

[observability] # 관찰성 설정 (모니터링)
enabled = true                   # 관찰성 기능 활성화

[dev] # 개발 서버 설정
port = 9393                      # 로컬 개발 서버 포트 

# Cloudflare Cron Triggers (UTC 기준)
[[triggers]]
crons = ["33 12 * * *"]